services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apice
      POSTGRES_PASSWORD: apice2026
      POSTGRES_DB: apice_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://apice:apice2026@postgres:5432/apice_dev
      REDIS_URL: redis://redis:6379
      JWT_SECRET: apice-jwt-secret-local-dev-2026
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FRONTEND_URL: http://localhost:3000
      PORT: 3001
      NODE_ENV: production
    depends_on:
      - postgres
      - redis

volumes:
  postgres_data:
